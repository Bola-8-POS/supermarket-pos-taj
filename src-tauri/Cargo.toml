[package]
name = "supermarket-pos"
version = "1.11.10"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "supermarket_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: the assistant JSON schema crosses Tauri IPC as a `Value`; llama-server builds its grammar from the
# `properties` order, and the default BTreeMap re-sorted it (`args` before `kind`), so Gemma refused every request.
serde_json = { version = "1", features = ["preserve_order"] }
dotenvy = "0.15"
tauri-plugin-notification = "2"
reqwest = { version = "0.12", features = ["json"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
url = "2"
minisign-verify = "0.3"
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Printing",
  "Win32_System_EventLog",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_JobObjects",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

